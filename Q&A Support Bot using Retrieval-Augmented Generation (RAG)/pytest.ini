[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Put the project root on sys.path so `app` and `tests` both import cleanly
# regardless of how pytest was invoked.
pythonpath = .

# The default run is fully mocked: no Ollama, no vector store, no downloads,
# no network, no cost. Integration tests are opt-in.
addopts = -v -m "not integration"

# Markers describe what a test *needs*, not what it is about, because that is
# what decides whether it can run in a given environment. A pull request can run
# everything that needs nothing; only a machine with Ollama can run the rest.
#
#   pytest                          mocked suite (the default, seconds, free)
#   pytest -m api                   HTTP contract, validation, error handling
#   pytest -m integration           real embeddings and/or a real model
#   pytest -m "ai and not judge"    answer quality, skipping the slow judge
#   pytest -m security              injection, leakage, hallucination behaviour
#
# A command-line -m overrides the one in addopts, so `pytest -m integration`
# works without editing this file.
markers =
    integration: needs the real embedding model and/or a running Ollama server. Run with: pytest -m integration
    api: exercises the HTTP layer - routes, schema validation, status codes, error bodies
    rag: exercises retrieval and the vector store rather than the API
    ai: scores answer quality with the evaluation framework; non-deterministic output, deterministic checks
    security: prompt injection, leakage, and refusal behaviour
    judge: uses an LLM as a judge; slowest tests, and advisory rather than a gate
